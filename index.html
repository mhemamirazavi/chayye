<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#180e0b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="کافه خلوت">
    <title>کافه خلوت | پناهگاه دیجیتال ما (v2.0.1)</title>
    
    <link rel="manifest" href="manifest.json">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="style.css">
    
    <!-- کتابخانه ارتباط آنی MQTT -->
    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
</head>
<body>

    <!-- صفحه ورود به کافه -->
    <div id="login-overlay">
        <div class="login-card">
            <div class="cafe-sign-badge">☕ کافه خلوت</div>
            <p class="login-subtitle">پناهگاه دنج دیجیتال ما • نسخه ۲.۰.۱</p>

            <div class="form-group">
                <label>نام شما در کافه:</label>
                <input type="text" id="login-name" class="pixel-input" placeholder="مثلاً: محمدحسین" autocomplete="off">
            </div>

            <div class="form-group">
                <label>شماره میز دو نفره (کد مشترک شما و یارتان):</label>
                <input type="text" id="login-room" class="pixel-input" placeholder="مثلاً: 1045" autocomplete="off">
            </div>

            <div class="form-group">
                <label>انتخاب کاراکتر شما پشت میز:</label>
                <div class="char-selector">
                    <div class="char-option selected" id="pick-char-male" onclick="CafeApp.selectCharacter('male')">
                        <div class="char-preview-wrap">
                            <img src="Pixel Art Winter Character Sprite.png" alt="کاراکتر آقا" onerror="this.style.opacity='0.3'">
                        </div>
                        <span>کاراکتر آقا</span>
                    </div>
                    <div class="char-option" id="pick-char-female" onclick="CafeApp.selectCharacter('female')">
                        <div class="char-preview-wrap">
                            <img src="Floral Hijab Pixel Art Character.png" alt="کاراکتر خانم" onerror="this.style.opacity='0.3'">
                        </div>
                        <span>کاراکتر خانم</span>
                    </div>
                </div>
            </div>

            <button type="button" class="enter-btn" onclick="CafeApp.enterCafe()">ورود به کافه خلوت 🔔</button>
        </div>
    </div>

    <!-- نوار وضعیت بالا (HUD) -->
    <header class="top-hud" id="top-hud">
        <div class="hud-pill" onclick="CafeApp.copyRoomCode()" title="کپی کردن شماره میز">
            <div id="peer-dot" class="status-dot"></div>
            <div class="status-texts">
                <div class="room-title" id="hud-room-title">میز: ---</div>
                <div class="peer-status-text" id="hud-peer-status">در حال اتصال به کافه...</div>
            </div>
        </div>

        <div class="hud-controls">
            <button type="button" class="hud-btn" onclick="CafeApp.toggleGramophoneModal()">📻 گرامافون</button>
            <button type="button" class="hud-btn" id="weather-btn" onclick="CafeApp.cycleWeather(true)">🌧️ بارانی</button>
            <button type="button" class="hud-btn" id="ambience-btn" onclick="CafeApp.toggleAmbience()">🔇 محیط</button>
            <button type="button" class="hud-btn" id="toggle-chat-hud-btn" onclick="CafeApp.toggleChatPanel()">💬 گفتگو</button>
        </div>
    </header>

    <!-- اعلان رویدادهای کافه -->
    <div id="presence-toast"></div>

    <!-- مودال گرامافون مشترک (۳ ترک Lo-Fi + افزودن موزیک دلخواه) -->
    <div class="cafe-modal" id="gramophone-modal">
        <div class="modal-header">
            <h3>📻 گرامافون مشترک کافه</h3>
            <button type="button" class="close-modal-btn" onclick="CafeApp.toggleGramophoneModal()">✕</button>
        </div>

        <div class="now-playing-box">
            <div class="np-info">
                <div class="np-title" id="np-track-title">۱. باران شبانه کافه (Lo-Fi Chill)</div>
                <div class="np-sub" id="np-status-sub">آماده پخش روی میز دو نفره</div>
            </div>
            <button type="button" class="gram-ctrl-btn" id="gram-play-btn" onclick="CafeApp.toggleGramophone(true)">▶ پخش</button>
        </div>

        <div class="track-list" id="gram-track-list"></div>

        <!-- بخش افزودن موزیک دلخواه (لینک مشترک یا فایل محلی) -->
        <div class="custom-music-box">
            <div class="custom-music-title">➕ افزودن موزیک دلخواه به گرامافون:</div>
            <div class="custom-url-row">
                <input type="text" id="custom-track-title" class="mini-input" placeholder="نام آهنگ...">
                <input type="url" id="custom-track-url" class="mini-input" placeholder="لینک مستقیم MP3...">
                <button type="button" class="mini-add-btn" onclick="CafeApp.addCustomUrlTrack()">افزودن</button>
            </div>
            <label class="file-upload-btn">
                🎵 انتخاب فایل صوتی از حافظه دستگاه
                <input type="file" accept="audio/*" style="display:none;" onchange="CafeApp.addLocalFileTrack(event)">
            </label>
        </div>
    </div>

    <!-- پلیر صوتی مخفی برای موزیک‌های سفارشی و استریم -->
    <audio id="external-audio-player" preload="auto" loop></audio>

    <!-- صحنه اصلی کافه + پنل گفتگو -->
    <main id="main-sanctuary">
        <section id="cafe-stage-wrapper">
            <div id="cafe-art-box">
                <canvas id="cafe-canvas" width="1024" height="1024"></canvas>
                <div id="reactions-layer"></div>
            </div>
        </section>

        <section id="floating-chat-panel">
            <div class="chat-top-bar">
                <div class="cafe-actions-bar">
                    <button type="button" class="act-btn" onclick="CafeApp.sendAction('☕ فنجان قهوه را نوشید', '☕')">☕ قهوه</button>
                    <button type="button" class="act-btn" onclick="CafeApp.sendAction('❤️ قلب فرستاد', '❤️')">❤️ قلب</button>
                    <button type="button" class="act-btn" onclick="CafeApp.sendAction('👋 دست تکان داد', '👋')">👋 سلام</button>
                    <button type="button" class="act-btn" onclick="CafeApp.sendAction('✨ لبخند گرمی زد', '✨')">✨ لبخند</button>
                </div>
                <button type="button" class="hide-chat-btn" onclick="CafeApp.toggleChatPanel(true)">خلوت ⬇</button>
            </div>

            <div id="messages-list"></div>

            <form class="chat-input-row" id="chat-form">
                <input type="text" id="chat-text-input" placeholder="پیام خود را بنویسید..." autocomplete="off">
                <button type="submit" class="send-msg-btn" id="send-msg-btn">ارسال</button>
            </form>
        </section>
    </main>

    <!-- ماژول‌های نسخه 2.0.1 -->
    <script src="network.js"></script>
    <script src="cafe-engine.js"></script>
    <script src="app.js"></script>
</body>
</html>
