<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#180e0b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="کافه خلوت">
    <title>کافه خلوت | پناهگاه دیجیتال ما (v1.1.4)</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
    <style id="embedded-rooyin-fonts"></style>
    <style>
        @font-face {
            font-family: 'RooyinBold';
            src: local('RooyinFree-Bold'), local('Rooyin Bold'), local('RooyinFreeNonEn-Bold');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'RooyinRegular';
            src: local('RooyinFree-Regular'), local('Rooyin Regular'), local('RooyinFreeNonEn-Regular');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-night: #120c14;
            --bg-espresso: #180e0b;
            --bg-wood-dark: #25150f;
            --bg-wood-med: #3b2218;
            --bg-wood-light: #5e3827;
            --cream-soft: #f6e9d7;
            --cream-muted: #ccb294;
            --amber-glow: #f09d38;
            --amber-bright: #ffd07b;
            --msg-me-bg: #4f2d1e;
            --msg-other-bg: #2a1811;
            --online-green: #4ade80;
            --offline-gray: #9ca3af;
            --glass-panel: rgba(24, 13, 10, 0.92);
            --pixel-border: #805036;
            --font-bold: 'RooyinBold', 'Vazirmatn', Tahoma, sans-serif;
            --font-regular: 'RooyinRegular', 'Vazirmatn', Tahoma, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, h1, h2, h3, h4, button, label, .cafe-sign-badge, .room-title, .msg-author, .act-btn, .hud-btn, .char-option span, .np-title {
            font-family: var(--font-bold);
            font-weight: 700;
        }

        .msg-body, .quoted-reply-box span, .reply-preview-text, .msg-meta, .system-event-msg, #chat-text-input, .pixel-input, .mini-input, .login-subtitle, .peer-status-text, .np-sub {
            font-family: var(--font-regular);
            font-weight: 400;
        }

        body {
            background-color: var(--bg-night);
            color: var(--cream-soft);
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            user-select: none;
            display: flex;
            flex-direction: column;
        }

        #login-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #2d1812 0%, #0f080a 100%);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            overflow-y: auto;
        }

        .login-card {
            background-color: var(--bg-wood-dark);
            border: 3px solid var(--pixel-border);
            box-shadow: 0 0 0 3px #0e0705, 0 20px 50px rgba(0,0,0,0.92), 0 0 40px rgba(240, 157, 56, 0.16);
            border-radius: 16px;
            padding: 1.3rem;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .cafe-sign-badge {
            display: inline-block;
            background: var(--bg-espresso);
            border: 2px solid var(--amber-glow);
            color: var(--amber-bright);
            padding: 0.35rem 1.15rem;
            border-radius: 8px;
            font-size: 1.22rem;
            margin-bottom: 0.3rem;
            box-shadow: 0 0 16px rgba(240, 157, 56, 0.3);
        }

        .login-subtitle {
            color: var(--cream-muted);
            font-size: 0.8rem;
            margin-bottom: 0.95rem;
        }

        .form-group {
            margin-bottom: 0.85rem;
            text-align: right;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            color: var(--cream-muted);
            margin-bottom: 0.3rem;
        }

        .pixel-input {
            width: 100%;
            padding: 0.62rem 0.85rem;
            background-color: var(--bg-espresso);
            border: 2px solid var(--bg-wood-light);
            border-radius: 8px;
            color: var(--cream-soft);
            font-size: 0.94rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .pixel-input:focus {
            border-color: var(--amber-glow);
            box-shadow: 0 0 10px rgba(240, 157, 56, 0.28);
        }

        .char-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.7rem;
            margin-bottom: 1rem;
        }

        .char-option {
            background-color: var(--bg-espresso);
            border: 2px solid var(--bg-wood-light);
            border-radius: 10px;
            padding: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
        }

        .char-preview-wrap {
            width: 66px;
            height: 74px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .char-preview-wrap img, .char-preview-wrap svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .char-option span {
            font-size: 0.8rem;
            color: var(--cream-muted);
        }

        .char-option.selected {
            border-color: var(--amber-glow);
            background-color: rgba(240, 157, 56, 0.15);
            box-shadow: 0 0 14px rgba(240, 157, 56, 0.32);
            transform: translateY(-2px);
        }

        .char-option.selected span {
            color: var(--amber-bright);
        }

        .enter-btn {
            width: 100%;
            padding: 0.78rem;
            background: linear-gradient(135deg, #e0872b 0%, #b35316 100%);
            border: 2px solid var(--amber-bright);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #6b2e09;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .enter-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #6b2e09;
        }

        .mobile-pack-trigger {
            margin-top: 0.65rem;
            width: 100%;
            padding: 0.52rem;
            background: rgba(94, 56, 39, 0.45);
            border: 1px dashed var(--amber-glow);
            border-radius: 8px;
            color: var(--amber-bright);
            font-size: 0.78rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.4rem;
        }

        .top-hud {
            width: 100%;
            padding: 6px 10px;
            background: rgba(18, 12, 20, 0.94);
            border-bottom: 2px solid var(--bg-wood-med);
            z-index: 40;
            display: none;
            justify-content: space-between;
            align-items: center;
            gap: 0.4rem;
            flex-shrink: 0;
        }

        .hud-pill {
            background: var(--glass-panel);
            border: 2px solid var(--pixel-border);
            border-radius: 10px;
            padding: 0.28rem 0.65rem;
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--offline-gray);
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .status-dot.online {
            background-color: var(--online-green);
            box-shadow: 0 0 10px var(--online-green);
        }

        .status-texts {
            display: flex;
            flex-direction: column;
        }

        .room-title {
            font-size: 0.76rem;
            color: var(--amber-bright);
            cursor: pointer;
        }

        .peer-status-text {
            font-size: 0.68rem;
            color: var(--cream-muted);
        }

        .hud-controls {
            display: flex;
            gap: 0.32rem;
            flex-wrap: wrap;
        }

        .hud-btn {
            background: var(--glass-panel);
            border: 2px solid var(--pixel-border);
            color: var(--cream-soft);
            border-radius: 8px;
            padding: 0.32rem 0.58rem;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            transition: all 0.2s;
        }

        .hud-btn:hover, .hud-btn.active {
            border-color: var(--amber-glow);
            background: rgba(79, 45, 30, 0.95);
            color: var(--amber-bright);
        }

        #main-sanctuary {
            flex: 1;
            width: 100%;
            height: calc(100dvh - 52px);
            display: none;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            background: radial-gradient(circle at center, #1d1422 0%, #110b14 100%);
        }

        #cafe-stage-wrapper {
            width: 100%;
            height: 57%;
            min-height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 4px;
            transition: height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #main-sanctuary.chat-minimized #cafe-stage-wrapper {
            height: 100%;
        }

        #cafe-art-box {
            position: relative;
            height: 100%;
            max-width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85);
        }

        #pixel-ref-canvas, #ref-cafe-img, #cafe-dynamic-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #ref-cafe-img { z-index: 2; }
        #pixel-ref-canvas { z-index: 1; }
        #cafe-dynamic-svg { z-index: 5; pointer-events: none; }

        .interactive-hotspot { pointer-events: auto; cursor: pointer; }

        #floating-chat-panel {
            width: 100%;
            height: 43%;
            background: var(--glass-panel);
            border-top: 2px solid var(--pixel-border);
            display: flex;
            flex-direction: column;
            z-index: 35;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            flex-shrink: 0;
        }

        #main-sanctuary.chat-minimized #floating-chat-panel {
            height: 0 !important;
            min-height: 0 !important;
            border: none;
            opacity: 0;
            pointer-events: none;
        }

        @media (min-width: 880px) {
            #main-sanctuary {
                flex-direction: row;
                align-items: stretch;
                padding: 10px;
                gap: 14px;
            }
            #cafe-stage-wrapper {
                flex: 1;
                height: 100% !important;
                padding: 0;
            }
            #floating-chat-panel {
                width: 400px;
                height: 100% !important;
                border: 2px solid var(--pixel-border);
                border-radius: 14px;
                box-shadow: 0 12px 35px rgba(0,0,0,0.85);
            }
        }

        @keyframes lampFlicker {
            0%, 100% { opacity: 0.78; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.04); }
        }
        @keyframes candleFlame {
            0%, 100% { transform: scaleY(1) rotate(-1deg); opacity: 0.95; }
            50% { transform: scaleY(1.18) rotate(2deg); opacity: 1; }
        }
        @keyframes steamRise {
            0% { transform: translateY(0) translateX(0); opacity: 0.8; }
            50% { transform: translateY(-14px) translateX(3px); opacity: 0.5; }
            100% { transform: translateY(-28px) translateX(-2px); opacity: 0; }
        }
        @keyframes noteFloat {
            0% { transform: translate(0, 0) scale(0.75); opacity: 0; }
            25% { opacity: 1; }
            100% { transform: translate(-18px, -42px) scale(1.18); opacity: 0; }
        }
        @keyframes svgPopReaction {
            0% { transform: translateY(10px) scale(0.4); opacity: 0; }
            18% { transform: translateY(-10px) scale(1.12); opacity: 1; }
            82% { transform: translateY(-22px) scale(1); opacity: 1; }
            100% { transform: translateY(-35px) scale(0.85); opacity: 0; }
        }

        .lamp-glow { animation: lampFlicker 3.8s infinite ease-in-out; transform-origin: center; transform-box: fill-box; }
        .candle-flicker { animation: candleFlame 1.8s infinite ease-in-out; transform-origin: bottom center; transform-box: fill-box; }
        .steam-p1 { animation: steamRise 2.6s infinite linear; }
        .steam-p2 { animation: steamRise 2.6s infinite linear 1.3s; }
        .music-note-1 { animation: noteFloat 2.5s infinite ease-out; }
        .music-note-2 { animation: noteFloat 2.5s infinite ease-out 1.25s; }
        .svg-reaction-pop { animation: svgPopReaction 3.2s forwards ease-out; }

        #presence-toast {
            position: fixed;
            top: 58px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(24, 14, 9, 0.96);
            border: 2px solid var(--amber-glow);
            color: var(--cream-soft);
            padding: 0.42rem 1rem;
            border-radius: 20px;
            font-size: 0.78rem;
            z-index: 80;
            opacity: 0;
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            box-shadow: 0 6px 20px rgba(0,0,0,0.8);
            white-space: nowrap;
        }
        #presence-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .cafe-modal {
            position: fixed;
            top: 58px;
            left: 50%;
            transform: translateX(-50%);
            width: 93%;
            max-width: 405px;
            background: rgba(26, 15, 10, 0.97);
            backdrop-filter: blur(12px);
            border: 2px solid var(--amber-glow);
            border-radius: 14px;
            padding: 0.9rem;
            z-index: 75;
            box-shadow: 0 15px 40px rgba(0,0,0,0.92);
            display: none;
            flex-direction: column;
            gap: 0.65rem;
        }
        .cafe-modal.open { display: flex; }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--bg-wood-light);
            padding-bottom: 0.45rem;
        }
        .modal-header h3 { font-size: 0.9rem; color: var(--amber-bright); }
        .close-modal-btn { background: none; border: none; color: var(--cream-muted); font-size: 1.05rem; cursor: pointer; }

        .now-playing-box {
            background: var(--bg-espresso);
            border: 1px solid var(--bg-wood-light);
            border-radius: 8px;
            padding: 0.55rem 0.7rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }
        .np-info { display: flex; flex-direction: column; gap: 0.15rem; overflow: hidden; text-align: right; }
        .np-title { font-size: 0.82rem; color: var(--cream-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .np-sub { font-size: 0.68rem; color: var(--amber-glow); }

        .gram-ctrl-btn {
            background: linear-gradient(135deg, #e0872b, #a85017);
            border: 1px solid var(--amber-bright);
            color: #fff;
            border-radius: 7px;
            padding: 0.35rem 0.7rem;
            font-size: 0.76rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .track-list { display: flex; flex-direction: column; gap: 0.35rem; max-height: 145px; overflow-y: auto; }
        .track-item {
            background: rgba(58, 34, 23, 0.52);
            border: 1px solid var(--bg-wood-light);
            border-radius: 7px;
            padding: 0.42rem 0.62rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: 0.76rem;
        }
        .track-item.active { border-color: var(--amber-bright); background: rgba(240, 157, 56, 0.25); color: var(--amber-bright); }

        .chat-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.35rem 0.6rem;
            background: rgba(16, 9, 5, 0.88);
            border-bottom: 1px solid var(--bg-wood-light);
            flex-shrink: 0;
        }
        .cafe-actions-bar { display: flex; gap: 0.3rem; overflow-x: auto; scrollbar-width: none; }
        .cafe-actions-bar::-webkit-scrollbar { display: none; }
        .act-btn {
            background: rgba(92, 56, 40, 0.5);
            border: 1px solid var(--pixel-border);
            color: var(--cream-soft);
            border-radius: 6px;
            padding: 0.2rem 0.48rem;
            font-size: 0.72rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .hide-chat-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--bg-wood-light);
            color: var(--cream-muted);
            border-radius: 6px;
            padding: 0.2rem 0.5rem;
            font-size: 0.71rem;
            cursor: pointer;
        }

        #messages-list {
            flex: 1;
            padding: 0.55rem 0.68rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.42rem;
            scroll-behavior: smooth;
        }
        #messages-list::-webkit-scrollbar { width: 5px; }
        #messages-list::-webkit-scrollbar-thumb { background: var(--bg-wood-light); border-radius: 4px; }

        .msg-bubble {
            max-width: 84%;
            padding: 0.42rem 0.7rem;
            border-radius: 10px;
            font-size: 0.86rem;
            line-height: 1.52;
            position: relative;
            word-wrap: break-word;
            border: 1px solid rgba(255,255,255,0.08);
            text-align: right;
        }
        .msg-bubble.me { align-self: flex-start; background-color: var(--msg-me-bg); border-color: #7d4a31; border-bottom-right-radius: 2px; }
        .msg-bubble.other { align-self: flex-end; background-color: var(--msg-other-bg); border-color: #4d3122; border-bottom-left-radius: 2px; }
        .msg-header { display: flex; justify-content: space-between; align-items: center; gap: 0.55rem; margin-bottom: 0.14rem; }
        .msg-author { font-size: 0.72rem; color: var(--amber-bright); }
        .reply-trigger-btn { background: none; border: none; color: var(--cream-muted); font-size: 0.7rem; cursor: pointer; }
        .msg-meta { font-size: 0.62rem; color: rgba(246, 233, 215, 0.58); text-align: left; margin-top: 0.14rem; }
        .system-event-msg {
            align-self: center;
            background: rgba(20, 11, 7, 0.82);
            border: 1px dashed var(--bg-wood-light);
            color: var(--cream-muted);
            font-size: 0.72rem;
            padding: 0.2rem 0.68rem;
            border-radius: 12px;
            text-align: center;
        }

        .chat-input-row {
            display: flex;
            gap: 0.38rem;
            padding: 0.42rem 0.55rem;
            background: rgba(16, 9, 5, 0.94);
            border-top: 1px solid var(--bg-wood-light);
            flex-shrink: 0;
        }
        #chat-text-input {
            flex: 1;
            padding: 0.46rem 0.72rem;
            background: var(--bg-espresso);
            border: 1px solid var(--bg-wood-light);
            border-radius: 8px;
            color: var(--cream-soft);
            font-size: 0.88rem;
            outline: none;
            text-align: right;
        }
        .send-msg-btn {
            background: linear-gradient(135deg, #e0872b, #a85017);
            border: 1px solid var(--amber-bright);
            color: #fff;
            padding: 0 0.95rem;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <div class="cafe-sign-badge">☕ کافه خلوت</div>
            <p class="login-subtitle">پناهگاه دنج دیجیتال ما (نسخه ۱.۱.۴)</p>

            <div class="form-group">
                <label>نام شما در کافه:</label>
                <input type="text" id="login-name" class="pixel-input" placeholder="مثلاً: محمدحسین" autocomplete="off">
            </div>

            <div class="form-group">
                <label>شماره میز دو نفره (کد مشترک شما و یارتان):</label>
                <input type="text" id="login-room" class="pixel-input" placeholder="مثلاً: 1405" autocomplete="off">
            </div>

            <div class="form-group">
                <label>انتخاب کاراکتر شما پشت میز:</label>
                <div class="char-selector">
                    <div class="char-option selected" id="pick-char-male" onclick="selectCharacter('male')">
                        <div class="char-preview-wrap">
                            <img id="login-img-male" src="Pixel Art Winter Character Sprite.png" alt="آقا" onerror="this.style.display='none';">
                        </div>
                        <span>کاراکتر آقا</span>
                    </div>
                    <div class="char-option" id="pick-char-female" onclick="selectCharacter('female')">
                        <div class="char-preview-wrap">
                            <img id="login-img-female" src="Floral Hijab Pixel Art Character.png" alt="خانم" onerror="this.style.display='none';">
                        </div>
                        <span>کاراکتر خانم</span>
                    </div>
                </div>
            </div>

            <button class="enter-btn" onclick="enterCafe()">ورود به کافه خلوت 🔔</button>
            <button type="button" class="mobile-pack-trigger" onclick="toggleMobileAssetsModal()">
                <span>📱 نصب دائمی فونت رویین و گرافیک کافه</span>
            </button>
        </div>
    </div>

    <div class="top-hud" id="top-hud">
        <div class="hud-pill">
            <div id="peer-dot" class="status-dot"></div>
            <div class="status-texts">
                <div class="room-title" id="hud-room-title" onclick="copyRoomCode()">میز: ---</div>
                <div class="peer-status-text" id="hud-peer-status">در حال اتصال به کافه...</div>
            </div>
        </div>

        <div class="hud-controls">
            <button class="hud-btn" onclick="toggleGramophoneModal()">📻 گرامافون</button>
            <button class="hud-btn" id="weather-btn" onclick="cycleWeather(true)">🌧️ بارانی</button>
            <button class="hud-btn" id="ambience-btn" onclick="toggleAmbience()">🔇 محیط</button>
            <button class="hud-btn" onclick="toggleMobileAssetsModal()">📱 فونت/موبایل</button>
        </div>
    </div>

    <div id="presence-toast"></div>

    <div class="cafe-modal" id="mobile-assets-modal">
        <div class="modal-header">
            <h3>📱 پک فونت رویین و گرافیک کافه</h3>
            <button class="close-modal-btn" onclick="toggleMobileAssetsModal()">✕</button>
        </div>
        <p style="font-size: 0.74rem; color: var(--cream-muted);">اگر عکس کافه یا فونت لود نشد، از اینجا فایلهای پروژه را انتخاب کنید:</p>
        <label class="gram-ctrl-btn" style="text-align:center; cursor:pointer; padding:0.5rem;">
            📂 انتخاب فایل‌های پروژه (عکس کافه + فونت رویین)
            <input type="file" multiple accept=".png,.jpg,.jpeg,.ttf,.woff,.woff2" style="display:none;" onchange="handleImportProjectAssets(event)">
        </label>
    </div>

    <div class="cafe-modal" id="gramophone-modal">
        <div class="modal-header">
            <h3>📻 گرامافون مشترک کافه</h3>
            <button class="close-modal-btn" onclick="toggleGramophoneModal()">✕</button>
        </div>
        <div class="now-playing-box">
            <div class="np-info">
                <div class="np-title" id="np-track-title">۱. باران شبانه کافه (Lofi)</div>
                <div class="np-sub">پخش همزمان دو نفره</div>
            </div>
            <button class="gram-ctrl-btn" id="gram-play-btn" onclick="toggleGramophonePlayback(true)">▶ پخش</button>
        </div>
        <div class="track-list" id="gram-track-list"></div>
    </div>

    <audio id="external-audio-player" preload="auto"></audio>

    <div id="main-sanctuary">
        <div id="cafe-stage-wrapper">
            <div id="cafe-art-box">
                <canvas id="pixel-ref-canvas" width="256" height="256"></canvas>
                <img id="ref-cafe-img" src="Gramophone Glow in a Cozy Café.png" alt="کافه خلوت" onerror="this.style.display='none';">

                <svg id="cafe-dynamic-svg" viewBox="0 0 1024 1024" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <clipPath id="refWindowClip">
                            <polygon points="552,175 848,332 848,608 552,442" />
                        </clipPath>
                        <radialGradient id="warmHalo" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#ffd584" stop-opacity="0.65"/>
                            <stop offset="100%" stop-color="#f09d38" stop-opacity="0"/>
                        </radialGradient>
                    </defs>
                    <g clip-path="url(#refWindowClip)" class="interactive-hotspot" onclick="cycleWeather(true)">
                        <polygon id="window-atmosphere-tint" points="538,162 848,378 848,668 538,445" fill="#131c2e" opacity="0.18"/>
                    </g>
                    <circle class="lamp-glow" cx="163" cy="340" r="65" fill="url(#warmHalo)"/>
                    <circle class="lamp-glow" cx="642" cy="312" r="85" fill="url(#warmHalo)"/>
                    <rect class="steam-p1" x="576" y="525" width="6" height="20" rx="3" fill="#f6e9d7" opacity="0.7"/>

                    <g transform="translate(500, 410)">
                        <text id="svg-name-male" x="-50" y="-10" fill="#f6e9d7" font-size="16" font-family="var(--font-bold)" text-anchor="middle">آقا</text>
                    </g>
                    <g transform="translate(680, 450)">
                        <text id="svg-name-female" x="50" y="-10" fill="#ffd07b" font-size="16" font-family="var(--font-bold)" text-anchor="middle">خانم</text>
                    </g>
                </svg>
            </div>
        </div>

        <div id="floating-chat-panel">
            <div class="chat-top-bar">
                <div class="cafe-actions-bar">
                    <button class="act-btn" onclick="sendCafeAction('☕ قهوه نوشید', '☕')">☕ قهوه</button>
                    <button class="act-btn" onclick="sendCafeAction('❤️ قلب فرستاد', '❤️')">❤️ قلب</button>
                    <button class="act-btn" onclick="sendCafeAction('👋 دست تکان داد', '👋')">👋 سلام</button>
                    <button class="act-btn" onclick="sendCafeAction('✨ لبخند زد', '✨')">✨ لبخند</button>
                </div>
                <button class="hide-chat-btn" onclick="toggleChatPanel(true)">بستن ⬇</button>
            </div>

            <div id="messages-list"></div>

            <form class="chat-input-row" onsubmit="handleSendMessage(event)">
                <input type="text" id="chat-text-input" placeholder="پیام..." autocomplete="off">
                <button type="submit" class="send-msg-btn">ارسال</button>
            </form>
        </div>
    </div>

    <script>
        let cachedAssets = { cafeBg: null, fontBold: null, fontReg: null, charMale: null, charFemale: null };
        let chatHistory = [];
        let roomCode = '';
        let roomTopic = '';
        let myName = '';
        let myChar = 'male';
        let mqttClient = null;
        let myClientId = 'khalvat_' + Math.random().toString(36).substring(2, 10);
        let peerState = { online: false, name: '', char: 'female', lastSeen: 0 };
        let weatherIdx = 0;
        const WEATHER_MODES = [
            { id: 'rain', label: 'بارانی', icon: '🌧️' },
            { id: 'autumn', label: 'پاییزی', icon: '🍂' },
            { id: 'snow', label: 'برفی', icon: '❄️' }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('pixel-ref-canvas');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#16111c';
                ctx.fillRect(0, 0, 256, 256);
            }
        });

        function selectCharacter(charType) {
            myChar = charType;
            document.getElementById('pick-char-male').classList.toggle('selected', charType === 'male');
            document.getElementById('pick-char-female').classList.toggle('selected', charType === 'female');
        }

        function enterCafe() {
            myName = document.getElementById('login-name').value.trim();
            roomCode = document.getElementById('login-room').value.trim();

            if (!myName || !roomCode) {
                showToast('⚠️ نام و شماره میز را وارد کنید');
                return;
            }

            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('top-hud').style.display = 'flex';
            document.getElementById('main-sanctuary').style.display = 'flex';
            document.getElementById('hud-room-title').textContent = 'میز: ' + roomCode;

            updateCharacterLabels();
            connectToCafeNetwork();
        }

        function updateCharacterLabels() {
            const maleTxt = document.getElementById('svg-name-male');
            const femaleTxt = document.getElementById('svg-name-female');
            if (myChar === 'male') {
                maleTxt.textContent = myName + ' (شما)';
                femaleTxt.textContent = peerState.online ? peerState.name : 'منتظر یار...';
            } else {
                femaleTxt.textContent = myName + ' (شما)';
                maleTxt.textContent = peerState.online ? peerState.name : 'منتظر یار...';
            }
        }

        function connectToCafeNetwork() {
            roomTopic = 'khalvat_sanctuary_v1_4/' + roomCode;

            // اتصال پایدار با استفاده از پورت امن و بروکر چندگانه
            mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
                clientId: myClientId,
                keepalive: 30,
                reconnectPeriod: 2000,
                connectTimeout: 10000
            });

            mqttClient.on('connect', () => {
                document.getElementById('peer-dot').classList.add('online');
                document.getElementById('peer-status-text').textContent = 'متصل به شبکه کافه';
                mqttClient.subscribe(roomTopic, (err) => {
                    if (!err) {
                        publishEvent({ type: 'join', sender: myName, char: myChar, id: myClientId });
                    }
                });
            });

            mqttClient.on('error', () => {
                // فال‌بک خودکار در صورت خطا به بروکر دوم
                tryMQTTSecondary();
            });

            mqttClient.on('message', (topic, payloadBuffer) => {
                let data;
                try { data = JSON.parse(payloadBuffer.toString()); } catch (e) { return; }
                if (data.id === myClientId) return;

                if (data.type === 'join' || data.type === 'here' || data.type === 'heartbeat') {
                    peerState.online = true;
                    peerState.name = data.sender;
                    peerState.char = data.char;
                    updatePeerStatusUI();
                    updateCharacterLabels();
                    if (data.type === 'join') {
                        publishEvent({ type: 'here', sender: myName, char: myChar, id: myClientId });
                    }
                } else if (data.type === 'chat') {
                    renderMessageBubble(data.msg, true);
                } else if (data.type === 'action') {
                    showFloatingReaction('peer', data.emoji);
                    addSystemLog(`${data.sender} ${data.text}`);
                }
            });

            setInterval(() => {
                publishEvent({ type: 'heartbeat', sender: myName, char: myChar, id: myClientId });
            }, 8000);
        }

        function tryMQTTSecondary() {
            try {
                mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
                    clientId: myClientId,
                    keepalive: 30,
                    reconnectPeriod: 2000
                });
                mqttClient.on('connect', () => {
                    mqttClient.subscribe(roomTopic, () => {
                        publishEvent({ type: 'join', sender: myName, char: myChar, id: myClientId });
                    });
                });
            } catch(e) {}
        }

        function publishEvent(obj) {
            if (mqttClient && mqttClient.connected) {
                mqttClient.publish(roomTopic, JSON.stringify(obj));
            }
        }

        function updatePeerStatusUI() {
            const dot = document.getElementById('peer-dot');
            const statusTxt = document.getElementById('hud-peer-status');
            if (peerState.online) {
                dot.classList.add('online');
                statusTxt.textContent = `${peerState.name}: آنلاین پشت میز ☕`;
            }
        }

        function handleSendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chat-text-input');
            const text = input.value.trim();
            if (!text) return;

            const msgObj = {
                msgId: 'm_' + Date.now(),
                senderName: myName,
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            renderMessageBubble(msgObj, true);
            publishEvent({ type: 'chat', sender: myName, msg: msgObj, id: myClientId });
            input.value = '';
        }

        function renderMessageBubble(msg, autoScroll = true) {
            const listEl = document.getElementById('messages-list');
            const isMe = msg.senderName === myName;
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble ' + (isMe ? 'me' : 'other');
            bubble.innerHTML = `
                <div class="msg-header"><span class="msg-author">${isMe ? 'شما' : escapeHtml(msg.senderName)}</span></div>
                <div class="msg-body">${escapeHtml(msg.text)}</div>
                <div class="msg-meta">${msg.time || ''}</div>
            `;
            listEl.appendChild(bubble);
            if (autoScroll) listEl.scrollTop = listEl.scrollHeight;
        }

        function addSystemLog(text) {
            const listEl = document.getElementById('messages-list');
            const div = document.createElement('div');
            div.className = 'system-event-msg';
            div.textContent = text;
            listEl.appendChild(div);
            listEl.scrollTop = listEl.scrollHeight;
        }

        function sendCafeAction(text, emoji) {
            showFloatingReaction('me', emoji);
            addSystemLog(`شما ${text}`);
            publishEvent({ type: 'action', sender: myName, text, emoji, id: myClientId });
        }

        function showFloatingReaction(who, emoji) {
            const artBox = document.getElementById('cafe-art-box');
            const el = document.createElement('div');
            el.className = 'svg-reaction-pop';
            el.textContent = emoji;
            el.style.position = 'absolute';
            el.style.left = who === 'me' ? '42%' : '58%';
            el.style.top = '40%';
            el.style.zIndex = '20';
            el.style.fontSize = '2.2rem';
            artBox.appendChild(el);
            setTimeout(() => el.remove(), 3200);
        }

        function cycleWeather() {
            weatherIdx = (weatherIdx + 1) % WEATHER_MODES.length;
            document.getElementById('weather-btn').textContent = WEATHER_MODES[weatherIdx].icon + ' ' + WEATHER_MODES[weatherIdx].label;
        }

        function toggleMobileAssetsModal() { document.getElementById('mobile-assets-modal').classList.toggle('open'); }
        function toggleGramophoneModal() { document.getElementById('gramophone-modal').classList.toggle('open'); }
        function toggleChatPanel(hide) { document.getElementById('main-sanctuary').classList.toggle('chat-minimized', hide); }
        function copyRoomCode() { navigator.clipboard.writeText(roomCode); showToast('📋 کد میز کپی شد!'); }

        function showToast(msg) {
            const t = document.getElementById('presence-toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function escapeHtml(str) {
            return str ? str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])) : '';
        }
    </script>
</body>
</html>
